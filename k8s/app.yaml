# Image tags IMAGE_TAG / DOCKERHUB_USER are substituted by Jenkins (envsubst).
apiVersion: v1
kind: Namespace
metadata:
  name: ss-to-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ss-to-code
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: ${DOCKERHUB_USER}/ss-to-code-backend:${IMAGE_TAG}
          ports: [{ containerPort: 8000 }]
          env:
            - name: APP_VERSION
              value: "${IMAGE_TAG}"
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: openai, key: OPENAI_API_KEY } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ss-to-code
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ss-to-code
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ${DOCKERHUB_USER}/ss-to-code-frontend:${IMAGE_TAG}
          ports: [{ containerPort: 3000 }]
          env:
            - name: BACKEND_URL
              value: http://backend:8000
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ss-to-code
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30080 }]
