server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_buffering off;          # stream generated code as it arrives
    proxy_read_timeout 300s;
  }
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
  error_page 404 /404.html;
}
