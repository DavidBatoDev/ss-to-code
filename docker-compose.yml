services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    ports: ["3000:8080"]
    depends_on: [backend]
    restart: unless-stopped
